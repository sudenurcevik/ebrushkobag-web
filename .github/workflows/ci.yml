name: CI

# Vercel is connected to this repository through its own Git integration, so it
# deploys every push on its own. This workflow deliberately does NOT deploy —
# it type-checks and builds, so a broken commit is visible in the pull request
# and in the commit status rather than only after Vercel has shipped it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run for the same branch pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # Same command Vercel runs, so a green build here means a green deploy.
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
